name: Klee score native layout proof
on:
  push:
    branches:
      - experiment/klee-layout-20261113
    paths:
      - 'score-layout/klee/**'
      - '.github/workflows/klee-score-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-klee:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          if test -s score-layout/klee/working.mscz; then
            echo "file=score-layout/klee/working.mscz" >> "$GITHUB_OUTPUT"
          elif test -s score-layout/klee/Paul_Klee_Harmonie_der_noerdlichen_Flora.mscz; then
            echo "file=score-layout/klee/Paul_Klee_Harmonie_der_noerdlichen_Flora.mscz" >> "$GITHUB_OUTPUT"
          elif test -s score-layout/klee/original.mscz; then
            echo "file=score-layout/klee/original.mscz" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upload Paul_Klee_Harmonie_der_noerdlichen_Flora.mscz into score-layout/klee to enable the native proof."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.input.outputs.file != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libegl1 libopengl0 libgl1 xvfb poppler-utils python3-pil
      - name: Install MuseScore Studio 4.7.6
        if: steps.input.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/musescore/MuseScore/releases/tags/v4.7.6'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'User-Agent':'AI-Notation-Studio-CI'})
          data=json.load(urllib.request.urlopen(req))
          assets=[a for a in data['assets'] if a['name'].endswith('.AppImage') and ('x86_64' in a['name'] or 'x64' in a['name'])]
          assert len(assets)==1, [a['name'] for a in assets]
          urllib.request.urlretrieve(assets[0]['browser_download_url'],'/tmp/musescore.AppImage')
          PY
          chmod +x /tmp/musescore.AppImage
      - name: Validate score source and preserve inventory
        if: steps.input.outputs.file != ''
        env:
          SCORE: ${{ steps.input.outputs.file }}
        run: |
          mkdir -p score-layout/klee/out
          python3 - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET,os,json
          with ZipFile(os.environ['SCORE']) as z:
              mscx=next(n for n in z.namelist() if n.endswith('.mscx'))
              root=ET.fromstring(z.read(mscx))
              score=root.find('Score')
              counts={
                'measures_staff_1':len(score.find("Staff[@id='1']").findall('Measure')),
                'notes':len(score.findall('.//Note')),
                'staff_texts':len(score.findall('.//StaffText'))
              }
              assert counts['measures_staff_1']==32,counts
              assert counts['notes']==535,counts
              print('INTEGRITY:',counts)
              with open('score-layout/klee/out/inventory.json','w') as f:json.dump(counts,f,indent=2)
          PY
      - name: Export PDF from real MuseScore Studio
        if: steps.input.outputs.file != ''
        env:
          QT_QPA_PLATFORM: offscreen
          SCORE: ${{ steps.input.outputs.file }}
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/musescore.AppImage -o score-layout/klee/out/klee-score.pdf "$SCORE"
          test -s score-layout/klee/out/klee-score.pdf
          pdfinfo score-layout/klee/out/klee-score.pdf | grep -E 'Pages:|Page size:'
          pdftoppm -r 140 -png score-layout/klee/out/klee-score.pdf score-layout/klee/out/page
          ls -lh score-layout/klee/out
      - name: Publish original score PDF and page images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klee-musescore-native-layout-proof
          path: |
            score-layout/klee/out/
          if-no-files-found: warn
