name: Native score insertion probe (isolated branch)
on:
  push:
    branches: [feat/native-output-target-spike-20261106]
    paths: [.github/workflows/native-measure-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Simulated safety checks
        run: node tests/test_native_measure_probe.cjs
      - name: Install headless GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64
      - name: Download official MuseScore Studio 4.7.6
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/musescore/MuseScore/releases/download/v4.7.6
          NAME=MuseScore-Studio-4.7.6.261022093-x86_64.AppImage
          curl -fL --retry 1 --max-time 240 -o "$NAME" "$BASE/$NAME"
          curl -fL --retry 1 --max-time 60 -o checksums.sha256.txt "$BASE/checksums.sha256.txt"
          awk -v n="$NAME" '$2==n {print}' checksums.sha256.txt | sha256sum -c -
          chmod +x "$NAME"
          ./"$NAME" --appimage-extract >/dev/null
      - name: Generate disposable minimal MusicXML test score
        run: |
          python - <<'PY'
          from pathlib import Path
          measures=[]
          for i in range(1,5):
              measures.append(f'<measure number="{i}"><attributes><divisions>480</divisions><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>'*(i==1)+('' if i==1 else f'<measure number="{i}">')+'<note><pitch><step>C</step><octave>4</octave></pitch><duration>1920</duration><type>whole</type></note></measure>')
          xml='<?xml version="1.0" encoding="utf-8"?><!DOCTYPE score-partwise  PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd"><score-partwise version="4.0"><work><work-title>ANS-TEST-Probe</work-title></work><movement-title>ANS-TEST-Probe</movement-title><identification><creator type="composer">Test</creator></identification><defaults/><part-list><score-part id="P1"><part-name>Flute</part-name></score-part></part-list><part id="P1">'+''.join(measures)+'</part></score-partwise>'
          Path('/tmp/ans-test.musicxml').write_text(xml)
          print('Wrote disposable test MusicXML',len(xml))
          PY
      - name: Import score with official MuseScore
        env:
          QT_QPA_PLATFORM: offscreen
          MU_QT_QPA_PLATFORM: offscreen
        run: |
          timeout 90 ./squashfs-root/AppRun -o /tmp/ans-test.mscz /tmp/ans-test.musicxml
          test -s /tmp/ans-test.mscz
      - name: Native GUI plugin discovery and invocation
        env:
          QT_QPA_PLATFORM: xcb
          MU_QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Documents/MuseScore4/Plugins"
          cp tests/native_measure_insertion_probe.qml "$HOME/Documents/MuseScore4/Plugins/"
          mkdir -p "$HOME/.local/share/MuseScore/MuseScore4/extensions"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.local/share/MuseScore/MuseScore4/extensions/config.json'
          p.write_text(json.dumps([{'uri':'musescore://extensions/v1/native_measure_insertion_probe.qml','actions':[{'code':'main','exec_point':'manually'}]}]))
          print('Created isolated extension manifest configuration:',p)
          PY
          cat >/tmp/ans-gui-driver.sh <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          ./squashfs-root/AppRun /tmp/ans-test.mscz > /tmp/ans-native-probe.log 2>&1 &
          pid=$!
          echo "MuseScore GUI pid=$pid"
          sleep 10
          xdotool search --onlyvisible --name 'MuseScore|ANS-TEST' getwindowname 2>&1 || true
          scrot /tmp/ans-before-menu.png || true
          # Standard Qt menu shortcut; instrumented as exploratory until native log proves plugin execution.
          xdotool key --clearmodifiers alt+p || true
          sleep 2
          scrot /tmp/ans-menu.png || true
          # If alt+p opened the Plugins menu, the plugin entry should be accessible by initial letter.
          xdotool key --clearmodifiers n Return || true
          sleep 5
          scrot /tmp/ans-after-menu.png || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          SH
          chmod +x /tmp/ans-gui-driver.sh
          timeout 55 xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- /tmp/ans-gui-driver.sh || true
          if grep -q 'ANS_NATIVE_PROBE PASS:' /tmp/ans-native-probe.log; then
            echo 'Native QML probe reached and returned PASS'
          else
            echo 'Native probe NOT VERIFIED; GUI screenshots/logs are diagnostic only'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-native-probe-logs
          path: |
            /tmp/ans-native-probe.log
            /tmp/ans-before-menu.png
            /tmp/ans-menu.png
            /tmp/ans-after-menu.png
          if-no-files-found: ignore
