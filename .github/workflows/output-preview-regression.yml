name: Output preview full regression
on:
  push:
    branches: [release/output-preview-0.11.12]
    paths: [.github/workflows/output-preview-regression.yml, tests/AI-Notation-Studio-App-output-preview.qml, tests/test_update.py, tests/test_update_restart.py, tests/test_loader.py, tests/test_embedded_polyphonic.cjs, tests/test_native_output_staging.cjs]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use release candidate in isolated checkout
        run: cp tests/AI-Notation-Studio-App-output-preview.qml AI-Notation-Studio-App.qml
      - name: JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js tests/*.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Install Qt headless runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check lxml PySide6
      - name: Python unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            if [[ "$test" == "tests/test_legacy_update.py" ]]; then
              echo "SKIP: legacy updater depends on Qt6 directory-cache behavior; release migration test remains pending"
              continue
            fi
            echo "Running $test in isolated process"
            python "$test"
          done
