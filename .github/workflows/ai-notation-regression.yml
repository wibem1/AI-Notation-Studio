name: AI Notation Studio regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js tests/*.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
